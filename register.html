        <main>
        <div class="registration-container">
            <h2 class="form-title">REGISTRATION FORM</h2>
            
            <form class="registration-form" novalidate>
                <!-- 2-Column Inputs Grid -->
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Enter Name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter E-mail ID" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile</label>
                        <input type="tel" id="mobile" placeholder="Phone Number" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob">
                    </div>

                    <div class="form-group">
                        <label for="dept">Department</label>
                        <select id="dept">
                            <option value="">Select Department</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="ME">ME</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="male" id="male"> Male</label>
                            <label><input type="radio" name="gender" value="female" id="female"> Female</label>
                        </div>
                    </div>
                </div>

                <!-- Full-Width Checkboxes Block -->
                <div class="form-group full-width">
                    <label>Select Events</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="ev1"> Code Quest</label>
                        <label><input type="checkbox" id="ev2"> Robo Race</label>
                        <label><input type="checkbox" id="ev3"> Capture the Flag (CTF)</label>
                    </div>
                </div>

                <!-- Full-Width Message Area -->
                <div class="form-group full-width">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Your query or message..."></textarea>
                </div>

                <!-- Buttons -->
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Submit</button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>
            </form>
        </div>
    </main>
